<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aviva</title>

  <!-- Tableau Extensions API (hosted locally — from tableau/extensions-api GitHub) -->
  <script src="./tableau.extensions.1.latest.min.js" type="text/javascript"></script>

  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f8fa;
      color: #1a1a2e;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      letter-spacing: -0.3px;
    }
    .header span {
      font-size: 11px;
      color: #888;
      font-weight: 400;
    }

    /* ── Input area ── */
    .input-row {
      display: flex;
      gap: 8px;
    }
    #question {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid #dde1ea;
      border-radius: 8px;
      font-size: 13px;
      color: #1a1a2e;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    #question:focus {
      border-color: #4c6ef5;
    }
    #question::placeholder {
      color: #aab0be;
    }
    #askBtn {
      padding: 10px 18px;
      background: #4c6ef5;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      white-space: nowrap;
    }
    #askBtn:hover { background: #3b5bdb; }
    #askBtn:disabled { opacity: 0.5; cursor: default; }

    /* ── Status bar ── */
    #status {
      font-size: 11px;
      color: #888;
      min-height: 14px;
    }
    #status.error { color: #e03131; }
    #status.success { color: #2f9e44; }

    /* ── Answer card ── */
    #answerCard {
      background: #fff;
      border: 1.5px solid #dde1ea;
      border-radius: 10px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }
    #answerCard.visible { display: flex; }

    .answer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .answer-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #aab0be;
    }

    /* ── Source badge ── */
    #sourceBadge {
      display: none;
      align-items: center;
      gap: 4px;
      background: #f3f0ff;
      color: #6741d9;
      border: 1px solid #d0bfff;
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    #sourceBadge.visible { display: inline-flex; }
    #sourceBadge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6741d9;
      flex-shrink: 0;
    }

    #answerText {
      font-size: 13px;
      line-height: 1.6;
      color: #1a1a2e;
    }

    /* ── Filter pills ── */
    #filtersSection { display: none; flex-direction: column; gap: 6px; }
    #filtersSection.visible { display: flex; }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #e7f5ff;
      color: #1971c2;
      border: 1px solid #a5d8ff;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 500;
    }
    .pill-field { font-weight: 700; }

    /* ── Clear button ── */
    #clearBtn {
      align-self: flex-start;
      background: none;
      border: 1.5px solid #dde1ea;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 11px;
      color: #555;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    #clearBtn:hover { border-color: #aab0be; }

    /* ── SQL expander ── */
    details {
      border: 1px solid #dde1ea;
      border-radius: 8px;
      overflow: hidden;
    }
    summary {
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      background: #f7f8fa;
      user-select: none;
    }
    summary:hover { background: #eef0f6; }
    pre {
      padding: 10px 12px;
      font-size: 11px;
      font-family: "SF Mono", "Fira Code", monospace;
      white-space: pre-wrap;
      word-break: break-all;
      color: #1a1a2e;
      background: #fff;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Aviva</h1>
    <span>Ask your data anything</span>
  </div>

  <div class="input-row">
    <input
      id="question"
      type="text"
      placeholder="e.g. Show me West region sales"
      autocomplete="off"
    />
    <button id="askBtn">Ask</button>
  </div>

  <div id="status"></div>

  <div id="answerCard">
    <div>
      <div class="answer-header">
        <div class="answer-label">Answer</div>
        <span id="sourceBadge"></span>
      </div>
      <div id="answerText"></div>
    </div>

    <div id="filtersSection">
      <div class="answer-label">Filters applied to dashboard</div>
      <div id="filterPills" class="filter-pills"></div>
    </div>

    <details id="sqlDetails">
      <summary>View SQL</summary>
      <pre id="sqlText"></pre>
    </details>

    <button id="clearBtn">Clear filters</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
